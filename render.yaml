# Blueprint do Render — landing page estática + rota do PDF (não precisa de banco).
services:
  - type: web
    name: landing-patrocinio
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Endereço do webhook do Make que recebe os leads do formulário (opcional).
      - key: MAKE_WEBHOOK_URL
        sync: false
